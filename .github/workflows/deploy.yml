name: GitHub Pages 배포 (한가위 + 퇴근길 학교)

# 한 사이트에 두 게임을 각각 다른 주소로 올립니다.
#   https://<사용자>.github.io/<레포>/                    → hangawi/ (한가위 게임, 기존 주소 유지)
#   https://<사용자>.github.io/<레포>/toegeungil-school/  → toegeungil-school/ (퇴근길 학교)
on:
  push:
    branches: [main, claude/upbeat-ride-tpmm9s]
    paths:
      - 'toegeungil-school/**'
      - 'hangawi/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: toegeungil-school

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: toegeungil-school/package-lock.json
      - run: npm ci
      - name: 퇴근길 학교 빌드
        run: npm run build
        env:
          # 레포 이름을 자동으로 읽어 base 경로로 사용 (예: /S2/toegeungil-school/)
          BASE_PATH: /${{ github.event.repository.name }}/toegeungil-school/
      - name: 두 게임을 한 사이트로 합치기
        working-directory: .
        run: |
          mkdir -p _site/toegeungil-school
          cp -r hangawi/. _site/
          cp -r toegeungil-school/dist/. _site/toegeungil-school/
          touch _site/.nojekyll
          find _site -maxdepth 2
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
